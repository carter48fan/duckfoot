name: Android
# Name each run for what it does, so a release that did not happen is visible in the list.
run-name: >-
  ${{ (inputs.release || startsWith(github.ref, 'refs/tags/v'))
      && format('Android release {0}', inputs.release || github.ref_name)
      || github.event_name == 'workflow_dispatch'
      && format('Android build of {0} (no release: no version given)', github.ref_name)
      || github.event.head_commit.message
      || github.event.pull_request.title
      || 'Android' }}

# On every branch, not only main: the job's product is an APK to install and try, and
# that is most useful for work that has not merged yet.
#
# A release: push a tag starting with v (v0.1.0, v0.2.0-alpha.1), or run this workflow by
# hand (Actions → Android → Run workflow) with a version. Either drafts a GitHub release
# with the APK attached; see android/README.md.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Draft a release with this version, e.g. v0.1.0-alpha.1 (empty: just build)"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      # Only the release step writes, and only for a version tag.
      contents: write
    env:
      DUCKFOOT_KEYSTORE_BASE64: ${{ secrets.DUCKFOOT_KEYSTORE_BASE64 }}
      # The version being released, if any: the pushed tag, or the hand-run's input.
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release }}
    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml pins the version: install it, then add the Android target to
      # *that* toolchain, which a target installed on `stable` would not be.
      - run: |
          rustup toolchain install
          rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      # The runner image ships the Android SDK and NDK; AGP 8 needs JDK 17.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # Clippy needs no linker, so it runs before the (slower) NDK build.
      - run: cargo clippy -p duckfoot-android --target aarch64-linux-android -- -D warnings

      # With a signing key in the repository's secrets (android/README.md), every build is
      # signed with it and installs over the last; without one, each uses a throwaway key.
      - name: Use the repository's signing key
        if: env.DUCKFOOT_KEYSTORE_BASE64 != ''
        run: |
          echo "$DUCKFOOT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/duckfoot.jks"
          echo "DUCKFOOT_KEYSTORE=$RUNNER_TEMP/duckfoot.jks" >> "$GITHUB_ENV"

      - name: Version from the release
        if: env.RELEASE_TAG != ''
        run: |
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "::error::A release version starts with v, like v0.1.0-alpha.1 (got '$RELEASE_TAG')"
            exit 1
          fi
          echo "DUCKFOOT_VERSION_NAME=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - run: android/build-apk.sh
        env:
          DUCKFOOT_KEYSTORE_PASSWORD: ${{ secrets.DUCKFOOT_KEYSTORE_PASSWORD }}
          DUCKFOOT_KEY_ALIAS: ${{ secrets.DUCKFOOT_KEY_ALIAS }}
          DUCKFOOT_KEY_PASSWORD: ${{ secrets.DUCKFOOT_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v6
        with:
          name: duckfoot-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # A draft: visible to the repository's collaborators, who can download the APK from
      # it, and public only once someone presses Publish. The README's licence note says
      # why binaries are not distributed yet.
      # For a hand-run the tag need not exist yet: it is made on this commit when the
      # draft is published.
      - name: Draft the release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          apk="duckfoot-$TAG.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$apk"
          if [ -n "$DUCKFOOT_KEYSTORE" ]; then
            signing="Signed with the repository's key: installs over earlier releases."
          else
            signing="Signed with a one-off key: uninstall any earlier Duckfoot build before installing this one."
          fi
          gh release create "$TAG" "$apk" \
            --target "$GITHUB_SHA" \
            --draft --prerelease \
            --title "Duckfoot $TAG (Android)" \
            --generate-notes \
            --notes "Android test build: Android 11+, a Vulkan GPU, arm64.
          $signing
          Install: download the .apk on the phone and open it, allowing installs from that app when asked; or \`adb install -r $apk\`."

      - name: Say why there is no release
        if: github.event_name == 'workflow_dispatch' && env.RELEASE_TAG == ''
        run: |
          echo "::notice::Built only. To draft a release, run again with a version such as v0.1.0-alpha.1 in the 'Draft a release with this version' box, on a branch whose workflow has that box."
