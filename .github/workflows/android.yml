name: Android

# On every branch, not only main: the job's product is an APK to install and try, and
# that is most useful for work that has not merged yet.
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      # The runner image ships the Android SDK and NDK; AGP 8 needs JDK 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # Clippy needs no linker, so it runs before the (slower) NDK build.
      - run: cargo clippy -p duckfoot-android --target aarch64-linux-android -- -D warnings

      - run: android/build-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: duckfoot-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
