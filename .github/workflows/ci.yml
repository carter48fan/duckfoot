name: Duckfoot CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # winit needs these to build on Linux even though CI never opens a window.
      - name: Install Linux windowing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev mesa-vulkan-drivers

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - run: cargo test --workspace --locked
      # HEIF is off by default (HEVC patents), so its code is tested with it on as well.
      - run: cargo test --locked -p photo-engine --features heif --lib

      # The pixel tests, on Mesa's software Vulkan: the only tests in which shaders
      # actually run. Required, so a missing driver fails rather than silently skipping.
      - name: GPU pixel tests (lavapipe)
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          DUCKFOOT_REQUIRE_GPU: "1"
        run: cargo test --release --locked -p photo-engine --test gpu --test drag

      # Catches WGSL errors, which are otherwise only found at device creation.
      - run: cargo build --workspace --all-targets --locked

  # Licences, advisories and sources of every dependency (deny.toml).
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2
  stubs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # DESIGN.md invariant 8: the docs document only what runs. The previous audit only
      # grepped the TypeScript packages, which is exactly where the unfinished code wasn't.
      - name: Audit stubs
        run: grep -rn '@stub' crates/ || echo "no stubs"
