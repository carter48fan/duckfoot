name: Duckfoot CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # winit needs these to build on Linux even though CI never opens a window.
      - name: Install Linux windowing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: cargo test --workspace

      # Catches WGSL errors, which are otherwise only found at device creation.
      - run: cargo build --workspace --all-targets

  stubs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # DESIGN.md invariant 8: the docs document only what runs. The previous audit only
      # grepped the TypeScript packages, which is exactly where the unfinished code wasn't.
      - name: Audit stubs
        run: grep -rn '@stub' crates/ || echo "no stubs"
