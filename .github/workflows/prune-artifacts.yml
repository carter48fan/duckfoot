name: Prune artifacts

# Build artifacts are only a hand-off from the build jobs to the release jobs of the same
# run, which publish them to Releases. Anything older than a day is a stale copy taking
# up the artifact storage quota, which once full fails every build's upload step.
# Run this by hand to clear a full quota at once; it also runs daily.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: "Delete artifacts older than this many hours"
        required: false
        default: "24"

permissions:
  actions: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          MAX_AGE_HOURS: ${{ inputs.max_age_hours || '24' }}
        with:
          script: |
            const cutoff = Date.now() - Number(process.env.MAX_AGE_HOURS) * 3600 * 1000;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 },
            );
            let deleted = 0, bytes = 0;
            for (const a of artifacts) {
              if (a.expired || Date.parse(a.created_at) > cutoff) continue;
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner, repo: context.repo.repo, artifact_id: a.id,
              });
              deleted += 1;
              bytes += a.size_in_bytes;
            }
            core.notice(`Deleted ${deleted} artifacts, ${(bytes / 1e6).toFixed(0)} MB`);
