# cargo-deny: what every dependency is checked against in CI (ci.yml's `deny` job), so a
# new crate with an unknown licence, a known vulnerability or a source outside crates.io
# fails the build instead of shipping. https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
ignore = [
    # `paste` is unmaintained, though finished: a proc-macro run at build time, through
    # rav1e (AVIF export). Nothing to replace it with from here.
    { id = "RUSTSEC-2024-0436", reason = "build-time proc-macro via rav1e; no maintained drop-in" },
    # Unmaintained (not vulnerable), and each reached only through a dependency, so not
    # ours to swap: revisit when those move.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: via ab_glyph (export watermark glyphs)" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant: via zbus (Linux file dialogs, AccessKit)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: via zbus (Linux file dialogs, AccessKit)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: via zbus (Linux file dialogs, AccessKit)" },
    { id = "RUSTSEC-2026-0543", reason = "chrono: via rawler (RAW decoding)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Each permits shipping in an MIT binary with its notice (THIRD_PARTY_LICENSES); LGPL-2.1
# is rawler's and rawloader's, met by the source shipped with every release
# (docs/LEGAL.md).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    # Boost: no notice needed for a binary (only for source copies). The Windows clipboard.
    "BSL-1.0",
    "Unlicense",
    "CC0-1.0",
    "BlueOak-1.0.0",
    "Unicode-3.0",
    "NCSA",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "LGPL-2.1",
    "LGPL-2.1-or-later",
]

[licenses.private]
# The workspace's own crates (MIT, unpublished).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's path dependencies have no version, which is not a wildcard on crates.io.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
