[package]
name = "duckfoot"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "duckfoot"
path = "src/main.rs"

[dependencies]
photo-app.workspace = true
photo-engine.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
winit.workspace = true
wgpu.workspace = true
anyhow.workspace = true
log.workspace = true
pollster = "1"

# The desktop binary's logger; Android logs through logcat instead. Screen readers
# (AccessKit) on the desktop; Android's goes through its own accessibility bridge later.
# rfd for the message box shown when no GPU can be started.
[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11"
egui-winit = { workspace = true, features = ["accesskit"] }
rfd = "0.17"
display-profile.workspace = true

[features]
# HEIF/HEIC stills; off by default, as HEVC is patented in some places
# (crates/vendor/lc-heif/VENDORED.md).
heif = ["photo-app/heif", "photo-engine/heif"]
