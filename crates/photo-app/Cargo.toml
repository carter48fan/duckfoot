[package]
name = "photo-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
photo-engine.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true
fluent-bundle = "0.16.0"
unic-langid = "0.9.6"

# No Android backend; Android supplies its pickers through `platform::Platform`.
[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.17"

[dev-dependencies]
# The no-op backend gives the headless UI test a real wgpu Device with no GPU behind it.
wgpu = { workspace = true, features = ["noop"] }
rawler.workspace = true
pollster = "1"

[features]
# HEIF/HEIC stills; off by default, as HEVC is patented in some places
# (crates/vendor/lc-heif/VENDORED.md).
heif = ["photo-engine/heif"]
