[package]
name = "photo-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
wgpu.workspace = true
bytemuck.workspace = true
rawloader.workspace = true
rawler.workspace = true
anyhow.workspace = true
log.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
half = { version = "2", features = ["bytemuck"] }
# TIFF written directly, for its EXIF directory (`image` wraps the same crate).
tiff = "0.11"
# Inflating the bundled lensfun table. Already in the tree through png.
miniz_oxide = "0.8"
# Parallel white-level histogram. Already in the tree through rawler.
rayon = "1"
# Finding embedded JPEG previews inside a RAW container.
memchr = "2"
# The one JPEG decoder that can scale in the DCT domain: a 45 MP embedded preview decoded
# at 1/8 skips nearly all of the IDCT, which is most of the cost of a thumbnail.
jpeg-decoder = { version = "0.3", default-features = false }
webp = { version = "0.3", default-features = false }
kamadak-exif = "0.6"
tract-onnx = "0.23"
# Baking printer proofs (W-10): a CMM for LUT-based ICC profiles. Already in the tree
# through image, at the same version.
moxcms = "0.8"
# Reading and writing XMP (ratings, labels, keywords other apps share). Already in the
# tree through wayland-scanner, at the same version.
quick-xml = "0.41"
# The CRC of the PNG chunk an export's XMP goes in. Already in the tree through png.
crc32fast = "1"
# AVIF export: rav1e through ravif, pure Rust (BSD-2/BSD-3). Without rav1e's "asm", which needs
# nasm, a non-Rust tool.
ravif = { version = "0.13", default-features = false, features = ["threading"] }
# JPEG XL export: a pure-Rust port of libjxl-tiny (BSD-3-Clause OR Apache-2.0). Pinned, as
# LightCraft pins it: young, and its output is checked against jxl-oxide in the tests.
jixel = "=0.3.4"
# Content-aware fill for the heal module's Remove spots: PatchMatch, vendored from LightCraft.
lc-inpaint = { path = "../vendor/lc-inpaint" }

# HEIF/HEIC (iPhone) stills: vendored from LightCraft, pure Rust. Optional, as HEVC is patented
# in some places (see crates/vendor/lc-heif/VENDORED.md).
lc-heif = { path = "../vendor/lc-heif", optional = true }

[features]
heif = ["dep:lc-heif"]

[dev-dependencies]
lc-heif = { path = "../vendor/lc-heif", features = ["testdata"] }
# Decoding the JPEG XL exports back in the tests (pure Rust).
jxl-oxide = { version = "0.12", default-features = false }
# The no-op backend: a real Device for tests of CPU-side wgpu validation, with no GPU.
# Counters: tests/drag.rs counts what is alive on the GPU through a drag (invariant 6).
wgpu = { workspace = true, features = ["noop", "counters"] }
pollster = "1"
env_logger = "0.11"
